name: Builder

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1
      - name: Run checks
        run: ./amp_runner/test.sh

  build:
    name: Build Amp Runner
    needs: validate
    permissions:
      contents: read
      id-token: write
      packages: write
    uses: ./.github/workflows/build-app.yaml
    with:
      app: amp_runner
      publish: ${{ github.event_name == 'push' }}
    secrets: inherit
